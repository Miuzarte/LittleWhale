distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 9.6.1 fixes an unrecoverable 9.6.0 worker cache on Windows; the AGP 9.4 resource pipeline
# that Gradle 9.7.1 pulls into assembleDebug is broken independently of the Gradle version
